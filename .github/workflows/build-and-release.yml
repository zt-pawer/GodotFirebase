name: Build and Release

on:
  push:

jobs:
  build-stub-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GDExtension headers
        run: |
          mkdir -p .tmp/gdextension
          curl -fsSL \
            https://raw.githubusercontent.com/migueldeicaza/SwiftGodot/f528ba67accbe3cca06c1d401c8f9d7c17022f63/Sources/GDExtension/include/gdextension_interface.h \
            -o .tmp/gdextension/gdextension_interface.h

      - name: Build Linux x64 stub
        run: |
          mkdir -p dist
          cc -std=c11 -Wall -Wextra -shared -fPIC \
            -I .tmp/gdextension \
            Generated/GodotFirebaseStub/godot_firebase_stub.c \
            -o dist/godot_firebase_stub.linux.x86_64.so

      - name: Upload Linux x64 stub
        uses: actions/upload-artifact@v4
        with:
          name: godot-firebase-stub-linux-x64
          path: dist/*.so
          if-no-files-found: error

  build-stub-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GDExtension headers
        run: |
          mkdir -p .tmp/gdextension
          curl -fsSL \
            https://raw.githubusercontent.com/migueldeicaza/SwiftGodot/f528ba67accbe3cca06c1d401c8f9d7c17022f63/Sources/GDExtension/include/gdextension_interface.h \
            -o .tmp/gdextension/gdextension_interface.h

      - name: Build Linux ARM64 stub
        run: |
          mkdir -p dist
          cc -std=c11 -Wall -Wextra -shared -fPIC \
            -I .tmp/gdextension \
            Generated/GodotFirebaseStub/godot_firebase_stub.c \
            -o dist/godot_firebase_stub.linux.arm64.so

      - name: Upload Linux ARM64 stub
        uses: actions/upload-artifact@v4
        with:
          name: godot-firebase-stub-linux-arm64
          path: dist/*.so
          if-no-files-found: error

  build-stub-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GDExtension headers
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/gdextension | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/migueldeicaza/SwiftGodot/f528ba67accbe3cca06c1d401c8f9d7c17022f63/Sources/GDExtension/include/gdextension_interface.h" `
            -OutFile ".tmp/gdextension/gdextension_interface.h"

      - name: Build Windows x64 stub
        shell: cmd
        run: |
          if not exist dist mkdir dist
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find Common7\Tools\VsDevCmd.bat`) do set "VSDEVCMD=%%i"
          if not defined VSDEVCMD exit /b 1
          call "%VSDEVCMD%" -arch=x64
          cl /std:c11 /W4 /LD /I .tmp\gdextension Generated\GodotFirebaseStub\godot_firebase_stub.c /link /OUT:dist\godot_firebase_stub.windows.x86_64.dll

      - name: Upload Windows x64 stub
        uses: actions/upload-artifact@v4
        with:
          name: godot-firebase-stub-windows-x64
          path: dist/*.dll
          if-no-files-found: error

  build-stub-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GDExtension headers
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/gdextension | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/migueldeicaza/SwiftGodot/f528ba67accbe3cca06c1d401c8f9d7c17022f63/Sources/GDExtension/include/gdextension_interface.h" `
            -OutFile ".tmp/gdextension/gdextension_interface.h"

      - name: Build Windows ARM64 stub
        shell: cmd
        run: |
          if not exist dist mkdir dist
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -find Common7\Tools\VsDevCmd.bat`) do set "VSDEVCMD=%%i"
          if not defined VSDEVCMD exit /b 1
          call "%VSDEVCMD%" -arch=arm64 -host_arch=x64
          cl /std:c11 /W4 /LD /I .tmp\gdextension Generated\GodotFirebaseStub\godot_firebase_stub.c /link /OUT:dist\godot_firebase_stub.windows.arm64.dll

      - name: Upload Windows ARM64 stub
        uses: actions/upload-artifact@v4
        with:
          name: godot-firebase-stub-windows-arm64
          path: dist/*.dll
          if-no-files-found: error

  package:
    needs:
      - build-stub-linux-x64
      - build-stub-linux-arm64
      - build-stub-windows-x64
      - build-stub-windows-arm64
    runs-on:
      - self-hosted
      - macos
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GIT_CONFIG_NOSYSTEM: 1
    steps:
      - name: Prune stale keychain references
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          KEEP=()
          while IFS= read -r kc; do
            kc="$(echo "${kc//\"/}" | xargs)"
            [ -n "$kc" ] && [ -e "$kc" ] && KEEP+=("$kc")
          done < <(security list-keychains -d user)
          if [ "${#KEEP[@]}" -eq 0 ] && [ -e "$LOGIN_KEYCHAIN" ]; then
            KEEP+=("$LOGIN_KEYCHAIN")
          fi
          if [ "${#KEEP[@]}" -gt 0 ]; then
            security list-keychains -d user -s "${KEEP[@]}"
            DEFAULT_KEYCHAIN="$(security default-keychain -d user 2>/dev/null | tr -d '"' | xargs || true)"
            if [ -z "$DEFAULT_KEYCHAIN" ] || [ ! -e "$DEFAULT_KEYCHAIN" ]; then
              security default-keychain -d user -s "${KEEP[0]}"
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import Code Signing Certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          ORIGINAL_KEYCHAINS=""
          while IFS= read -r kc; do
            kc="$(echo "${kc//\"/}" | xargs)"
            if [ -n "$kc" ] && [ -e "$kc" ]; then
              ORIGINAL_KEYCHAINS="$ORIGINAL_KEYCHAINS $kc"
            fi
          done < <(security list-keychains -d user)
          ORIGINAL_KEYCHAINS="${ORIGINAL_KEYCHAINS# }"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $ORIGINAL_KEYCHAINS
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "ORIGINAL_KEYCHAINS=$ORIGINAL_KEYCHAINS"
          } >> "$GITHUB_ENV"

      - name: Build xcframework (iOS + macOS)
        env:
          XCODEBUILD_SETTINGS: CODE_SIGNING_ALLOWED=NO OTHER_LDFLAGS=-Wl,-headerpad_max_install_names
        run: |
          set -euo pipefail
          DERIVED_DATA="$(pwd)/.xcodebuild"
          WORKSPACE=".swiftpm/xcode/package.xcworkspace"
          CONFIG="Release"
          SCHEME="GodotFirebase"

          build_dest() {
            local dest="$1"
            local suffix="$2"
            caffeinate -dimsu xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration "$CONFIG" \
              -destination "$dest" \
              -derivedDataPath "${DERIVED_DATA}${suffix}" \
              $XCODEBUILD_SETTINGS \
              build
          }

          build_dest "generic/platform=iOS" ""
          build_dest "generic/platform=iOS Simulator" "simulator"
          build_dest "platform=macOS,arch=arm64" "arm64"

          if [ "$(uname -m)" = "arm64" ]; then
            arch -x86_64 caffeinate -dimsu xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration "$CONFIG" \
              -destination "platform=macOS,arch=x86_64" \
              -derivedDataPath "${DERIVED_DATA}x86_64" \
              $XCODEBUILD_SETTINGS \
              build
          else
            build_dest "platform=macOS,arch=x86_64" "x86_64"
          fi

      - name: Package xcframework and macOS frameworks
        run: |
          set -euo pipefail
          DERIVED_DATA="$(pwd)/.xcodebuild"
          CONFIG="Release"
          ADDON_BIN="addons/GodotFirebase/bin"
          mkdir -p "$ADDON_BIN"

          rm -rf "$ADDON_BIN/GodotFirebase.xcframework" \
                 "$ADDON_BIN/GodotFirebase.framework" \
                 "$ADDON_BIN/GodotFirebase_x64.framework"

          xcodebuild -create-xcframework \
            -framework "${DERIVED_DATA}/Build/Products/${CONFIG}-iphoneos/PackageFrameworks/GodotFirebase.framework" \
            -framework "${DERIVED_DATA}simulator/Build/Products/${CONFIG}-iphonesimulator/PackageFrameworks/GodotFirebase.framework" \
            -output "$ADDON_BIN/GodotFirebase.xcframework"

          rsync -a \
            "${DERIVED_DATA}arm64/Build/Products/${CONFIG}/PackageFrameworks/GodotFirebase.framework/" \
            "$ADDON_BIN/GodotFirebase.framework"

          rsync -a \
            "${DERIVED_DATA}x86_64/Build/Products/${CONFIG}/PackageFrameworks/GodotFirebase.framework/" \
            "$ADDON_BIN/GodotFirebase_x64.framework"

          # Fix install names and rpaths so the frameworks find SwiftGodotRuntime
          RUNTIME_RPATH="@loader_path/../../../../../GodotApplePluginsRuntime/bin"
          RUNTIME_FRAMEWORK_RPATH="@loader_path/../../../GodotApplePluginsRuntime/bin"
          fix_rpath() {
            local binary="$1"
            local old_rpath="$2"
            local runtime_framework="$3"
            install_name_tool -add_rpath "$RUNTIME_RPATH" "$binary" 2>/dev/null || true
            install_name_tool -add_rpath "$RUNTIME_FRAMEWORK_RPATH" "$binary" 2>/dev/null || true
            if otool -l "$binary" | grep -Fq "path $old_rpath "; then
              install_name_tool -delete_rpath "$old_rpath" "$binary" 2>/dev/null || true
            fi
          }
          fix_rpath \
            "$ADDON_BIN/GodotFirebase.framework/Versions/A/GodotFirebase" \
            "${DERIVED_DATA}arm64/Build/Products/${CONFIG}/PackageFrameworks" \
            "SwiftGodotRuntime.framework"
          fix_rpath \
            "$ADDON_BIN/GodotFirebase_x64.framework/Versions/A/GodotFirebase" \
            "${DERIVED_DATA}x86_64/Build/Products/${CONFIG}/PackageFrameworks" \
            "SwiftGodotRuntime_x64.framework"

      - name: Download stubs
        uses: actions/download-artifact@v4
        with:
          pattern: godot-firebase-stub-*
          path: ${{ runner.temp }}/stubs
          merge-multiple: true

      - name: Install stubs
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/stubs/"*.so "$RUNNER_TEMP/stubs/"*.dll addons/GodotFirebase/bin/ 2>/dev/null || true
          find "$RUNNER_TEMP/stubs" -type f | sort
          ls -la addons/GodotFirebase/bin/

      - name: Sign macOS frameworks
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )
          test -n "$SIGNING_IDENTITY"
          find addons/GodotFirebase/bin -path '*.framework' -type d | sort | while read -r fw; do
            codesign --keychain "$KEYCHAIN_PATH" --force --options runtime --timestamp \
              --sign "$SIGNING_IDENTITY" "$fw"
          done

      - name: Archive addon
        run: |
          set -euo pipefail
          PACKAGE_NAME="GodotFirebase-addons-${GITHUB_SHA}.zip"
          rm -rf dist
          mkdir -p dist/addons
          ditto addons/GodotFirebase "dist/addons/GodotFirebase"
          ditto -c -k --sequesterRsrc --keepParent dist "$PACKAGE_NAME"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.MACOS_CERTIFICATE != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$PACKAGE_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Addons build for ${{ github.sha }}
          body: Automated build triggered by ${{ github.ref }}
          files: ${{ env.PACKAGE_NAME }}

      - name: Clean up signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          existing_keychains=()
          for keychain in ${ORIGINAL_KEYCHAINS:-}; do
            if [ -e "$keychain" ]; then
              existing_keychains+=("$keychain")
            fi
          done
          if [ "${#existing_keychains[@]}" -gt 0 ]; then
            security list-keychains -d user -s "${existing_keychains[@]}" || true
          fi
          security delete-keychain "$KEYCHAIN_PATH" || true
